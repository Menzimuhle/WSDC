name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC (08:17 SA time)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/training_modules?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
